<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173a6b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>re.lib – Konstrukteur-Bibliothek</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#1b2430;--mut:#5d6b7c;--line:#dde3ea;--acc:#1f5fa8;--acc2:#e8f0fa;--res:#0d6e4f;--resbg:#e9f7f1;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--fg:#e6ebf1;--mut:#98a5b5;--line:#2c3643;--acc:#6aa8f0;--acc2:#1e2c3d;--res:#5fd3a6;--resbg:#15302a;--warn:#f0b35a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);font-size:15px}
header{background:#173a6b;color:#fff;padding:10px 16px 0;position:sticky;top:0;z-index:5}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hd img{width:34px;height:34px;border-radius:7px}
header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.3px;flex:1}
header h1 span{opacity:.7;font-weight:400;font-size:13px;margin-left:6px}
.updbtn{background:transparent;border:1px solid #5f7fa8;color:#dfe9f6;border-radius:6px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
#updbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#173a6b;color:#fff;font-size:13.5px;font-weight:600;border-radius:8px;margin-bottom:12px}
#updbar span{flex:1}
#updbar .upd-go{border:0;background:#ef7d1f;color:#fff;font-weight:700;border-radius:5px;padding:7px 12px;font-size:13.5px;cursor:pointer}
#updbar .upd-x{border:0;background:transparent;color:#cfd9e6;font-size:15px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222c38;color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
.fig{margin:4px 0 8px;background:var(--bg);border-radius:8px;padding:4px;color:var(--fg)}
.fig svg{display:block;width:100%;height:auto;max-height:120px}
.fig .ln{stroke:currentColor;stroke-width:1.8;fill:none}
.fig .lf{stroke:currentColor;stroke-width:1.6;fill:var(--acc2)}
.fig .ac{stroke:#ef7d1f;stroke-width:2.2;fill:none}
.fig .af{fill:#ef7d1f;stroke:none}
.fig .dm{stroke:var(--mut);stroke-width:1;fill:none}
.fig .cl{stroke:var(--mut);stroke-width:.9;fill:none;stroke-dasharray:8 3 2 3}
.fig .dl{stroke:#ef7d1f;stroke-width:1.4;fill:none;stroke-dasharray:5 3}
.fig .ht{stroke:var(--mut);stroke-width:1}
.fig text{font:italic 600 12px system-ui,sans-serif;fill:currentColor;text-anchor:middle}
.fig text.o{fill:#ef7d1f}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:#cfe0f5;padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#7fb8ff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:15px;margin-bottom:12px}
.wide{grid-column:1/-1}
.pdfbar{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.pdfin{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}
.pdfbtn{background:#ef7d1f;color:#fff;border:0;border-radius:7px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.pdfbtn:disabled{opacity:.7}
@media (max-width:760px){.pdfin{grid-template-columns:1fr}}
.sub{font-size:13px;font-weight:600;color:var(--acc);margin:12px 0 2px;border-top:1px solid var(--line);padding-top:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.fit{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px}
.fit div{display:grid;grid-template-columns:minmax(0,1fr) 34px 56px;gap:6px;align-items:center;font-size:13px}
.fit small{color:var(--mut);text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--fg);padding:7px 14px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.txt{font-weight:600;color:var(--res);text-align:right;padding-right:4px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 2px;font-size:15px}
.card .f{font-family:Consolas,"Courier New",monospace;font-size:12.5px;color:var(--mut);margin-bottom:10px;white-space:pre-wrap}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--acc);margin-bottom:4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 96px;gap:6px;align-items:center;margin:5px 0}
.row label{font-size:13.5px;overflow-wrap:anywhere;hyphens:auto}
.row label small{color:var(--mut)}
input,select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:14px}
input{text-align:right;font-variant-numeric:tabular-nums}
.row.out{background:var(--resbg);border-radius:6px;padding:3px 6px;margin:4px -6px}
.row.out .v{text-align:right;font-weight:600;color:var(--res);font-variant-numeric:tabular-nums;padding-right:4px}
.preset{margin:-2px 0 6px;display:grid;grid-template-columns:1fr 206px;gap:6px;align-items:center}
.preset span{font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--warn);margin-top:6px}
.conv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.convres{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.convres div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.convres div b{font-variant-numeric:tabular-nums;color:var(--res)}
.convres div.src{border-color:var(--acc);background:var(--acc2)}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--card);font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right}
th{background:var(--acc2);text-align:center;font-weight:600}
td:first-child,th:first-child{text-align:left}
.tw{overflow-x:auto;margin-bottom:18px;border-radius:8px}
h2{font-size:16px;margin:18px 0 8px}
.hint{font-size:12.5px;color:var(--mut);margin:4px 0 12px}
.hide{display:none!important}
@media (max-width:600px){header h1 span{display:none}.row{grid-template-columns:minmax(0,1fr) 92px 84px}.conv{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.preset{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="hd"><img src="icon-192.png" alt=""><h1>re.lib <span>Formeln · Einheiten · Kältetechnik</span></h1><button class="updbtn" id="updchk" type="button">⟳ Updates <small id="verlbl"></small></button></div>
  <nav id="tabs">
    <button data-t="conv" class="on">Umrechner</button>
    <button data-t="mech">Mechanik</button>
    <button data-t="kaelte">Kältetechnik</button>
    <button data-t="calc">Berechnungen</button>
    <button data-t="tab">Tabellen</button>
  </nav>
</header>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef7d1f"/></marker>
  <marker id="dh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#8a97a8" stroke-width="1.6"/></marker>
</defs></svg>
<div id="toast"></div>
<main>
  <div id="updslot"></div>
  <section id="p-conv"></section>
  <section id="p-mech" class="hide"><input class="search" placeholder="Formel suchen … (z. B. Biegung, Masse, Rohr)" data-for="mech"><div class="grid" id="g-mech"></div></section>
  <section id="p-kaelte" class="hide"><input class="search" placeholder="Suchen … (z. B. COP, Taupunkt, Überhitzung)" data-for="kaelte"><div class="grid" id="g-kaelte"></div></section>
  <section id="p-calc" class="hide"><div class="grid" id="g-calc"></div></section>
  <section id="p-tab" class="hide"></section>
</main>
<script>
"use strict";
/* ============ EINHEITEN ============ */
// Faktor = Wert in SI-Basiseinheit; Objekt {to,from} für Offset-Einheiten
const Q = {
 len:{n:"Länge",u:{"mm":1e-3,"µm":1e-6,"cm":1e-2,"dm":0.1,"m":1,"km":1e3,"in":0.0254,"ft":0.3048,"yd":0.9144,"mi":1609.344}},
 area:{n:"Fläche",u:{"mm²":1e-6,"cm²":1e-4,"dm²":1e-2,"m²":1,"ha":1e4,"in²":6.4516e-4,"ft²":0.09290304}},
 vol:{n:"Volumen",u:{"mm³":1e-9,"cm³":1e-6,"ml":1e-6,"l":1e-3,"dm³":1e-3,"m³":1,"in³":1.6387064e-5,"ft³":0.028316846592,"gal (US)":3.785411784e-3}},
 mass:{n:"Masse",u:{"g":1e-3,"kg":1,"t":1e3,"lb":0.45359237,"oz":0.028349523125}},
 force:{n:"Kraft",u:{"N":1,"kN":1e3,"MN":1e6,"daN":10,"kp":9.80665,"lbf":4.4482216152605}},
 press:{n:"Druck / Spannung",u:{"Pa":1,"hPa":100,"kPa":1e3,"MPa":1e6,"N/mm²":1e6,"GPa":1e9,"mbar":100,"bar":1e5,"psi":6894.757293168,"ksi":6894757.293168,"atm":101325,"mmHg":133.322387415,"mWS":9806.65,"kp/cm²":98066.5}},
 pabs:{n:"Druck abs./Überdruck",u:{"bar (abs)":1e5,"bar (ü)":{to:x=>x*1e5+101325,from:x=>(x-101325)/1e5},"kPa (abs)":1e3,"MPa (abs)":1e6,"psia":6894.757293168,"psig":{to:x=>x*6894.757293168+101325,from:x=>(x-101325)/6894.757293168}}},
 torque:{n:"Drehmoment",u:{"Nm":1,"Nmm":1e-3,"kNm":1e3,"kpm":9.80665,"lbf·ft":1.3558179483314,"lbf·in":0.1129848290276}},
 energy:{n:"Energie / Arbeit",u:{"J":1,"kJ":1e3,"MJ":1e6,"Wh":3600,"kWh":3.6e6,"MWh":3.6e9,"kcal":4186.8,"BTU":1055.05585262}},
 power:{n:"Leistung",u:{"W":1,"kW":1e3,"MW":1e6,"PS":735.49875,"hp":745.69987158,"kcal/h":1.163,"BTU/h":0.29307107,"TR (Kältetonne)":3516.8528}},
 temp:{n:"Temperatur",u:{"°C":{to:x=>x+273.15,from:x=>x-273.15},"K":1,"°F":{to:x=>(x-32)*5/9+273.15,from:x=>(x-273.15)*9/5+32}}},
 dtemp:{n:"Temperaturdifferenz",u:{"K":1,"°C (Δ)":1,"°F (Δ)":5/9}},

 vflow:{n:"Volumenstrom",u:{"m³/h":1/3600,"m³/s":1,"l/s":1e-3,"l/min":1/60000,"l/h":1/3.6e6,"cfm":4.719474432e-4,"gpm (US)":6.30901964e-5}},
 mflow:{n:"Massenstrom",u:{"kg/s":1,"kg/h":1/3600,"g/s":1e-3,"t/h":1/3.6,"lb/h":0.45359237/3600}},
 dens:{n:"Dichte",u:{"kg/m³":1,"g/cm³":1e3,"kg/dm³":1e3,"t/m³":1e3,"lb/ft³":16.01846337}},
 angle:{n:"Winkel",u:{"°":Math.PI/180,"rad":1,"gon":Math.PI/200,"′ (Minute)":Math.PI/10800}},
 time:{n:"Zeit",u:{"s":1,"ms":1e-3,"min":60,"h":3600,"d":86400}},
 inertia:{n:"Flächenträgheitsmoment",u:{"mm⁴":1e-12,"cm⁴":1e-8,"m⁴":1,"in⁴":4.162314256e-7}},
 smod:{n:"Widerstandsmoment",u:{"mm³":1e-9,"cm³":1e-6,"m³":1,"in³":1.6387064e-5}},
 cp:{n:"Spez. Wärmekapazität",u:{"kJ/(kg·K)":1e3,"J/(kg·K)":1,"kcal/(kg·K)":4186.8,"BTU/(lb·°F)":4186.8}},
 enth:{n:"Spez. Enthalpie",u:{"kJ/kg":1e3,"J/kg":1,"BTU/lb":2326}},
 uval:{n:"Wärmedurchgangskoeff.",u:{"W/(m²·K)":1,"kcal/(h·m²·K)":1.163,"BTU/(h·ft²·°F)":5.678263}},
 linexp:{n:"Ausdehnungskoeff.",u:{"10⁻⁶/K":1e-6,"1/K":1}},
 acc:{n:"Beschleunigung",u:{"m/s²":1,"g":9.80665,"ft/s²":0.3048}},
 pct:{n:"Prozent",u:{"%":0.01,"–":1}},
 num:{n:"Zahl",u:{"–":1}},
 gpress:{n:"Luftdruck",u:{"hPa":100,"mbar":100,"kPa":1e3,"bar":1e5}},
 hum:{n:"Feuchtegehalt",u:{"g/kg":1e-3,"kg/kg":1}},
 visc:{n:"Dyn. Viskosität",u:{"mPa·s":1e-3,"cP":1e-3,"Pa·s":1,"µPa·s":1e-6}},
 molm:{n:"Molmasse",u:{"g/mol":1e-3,"kg/kmol":1e-3,"kg/mol":1}},
 dpl:{n:"Druckgefälle",u:{"Pa/m":1,"mbar/m":100,"mbar/100 m":1,"bar/100 m":1000,"kPa/m":1000}}
};
const toSI=(q,u,x)=>{const f=Q[q].u[u];return typeof f==="object"?f.to(x):x*f};
const fromSI=(q,u,x)=>{const f=Q[q].u[u];return typeof f==="object"?f.from(x):x/f};
const parse=s=>{s=String(s).trim().replace(/\s/g,"").replace(",",".");return s===""?NaN:Number(s)};
const fmt=x=>{if(!isFinite(x))return "–";const a=Math.abs(x);
  if(a!==0&&(a<1e-4||a>=1e9))return x.toExponential(4).replace(".",",");
  return x.toLocaleString("de-CH",{maximumSignificantDigits:6});};
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}c.forEach(x=>e.append(x));return e};
const unitSel=(q,def)=>{const s=el("select");Object.keys(Q[q].u).forEach(u=>s.append(el("option",{value:u},u)));s.value=def||Object.keys(Q[q].u)[0];return s};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ============ PRESETS ============ */
const MAT_RHO=[["Stahl",7850],["Edelstahl 1.4301",7900],["Aluminium",2700],["Kupfer",8960],["Messing",8500],["Grauguss",7200],["Titan",4500],["POM",1410],["PA6",1140],["PE-HD",950]];
const MAT_E=[["Stahl",210e9],["Edelstahl",200e9],["Aluminium",70e9],["Kupfer",120e9],["Messing",100e9],["Grauguss",110e9],["Titan",110e9]];
const MAT_A=[["Stahl",12e-6],["Edelstahl 1.4301",16e-6],["Aluminium",23e-6],["Kupfer",17e-6],["Messing",19e-6],["Grauguss",10.5e-6],["Titan",8.6e-6],["POM",110e-6],["PA6",80e-6]];
// Glykol-Wasser-Gemische (Vol.-%, Richtwerte bei ca. 0 °C): [Konz, Gefrierpunkt °C, ρ kg/m³, cp J/(kg·K)]
const GLY={
 "Ethylenglykol (MEG)":[[0,0,1000,4210],[10,-3.5,1014,4050],[20,-8,1029,3870],[30,-15,1045,3680],[40,-24,1060,3480],[50,-36,1075,3270],[60,-52,1090,3040]],
 "Propylenglykol (MPG)":[[0,0,1000,4210],[10,-3,1010,4120],[20,-7,1020,4000],[30,-13,1030,3850],[40,-21,1040,3680],[50,-33,1047,3480],[60,-49,1055,3270]]
};
const FLUID_RHO=[["Wasser 10 °C",1000],["Wasser 40 °C",992],["Ethylenglykol 30 % (0 °C)",1045],["Ethylenglykol 40 % (0 °C)",1060],["Ethylenglykol 50 % (0 °C)",1075],["Propylenglykol 30 % (0 °C)",1030],["Propylenglykol 40 % (0 °C)",1040],["Propylenglykol 50 % (0 °C)",1047],["Luft 20 °C",1.2]];
const FLUID_CP=[["Wasser",4190],["Ethylenglykol 30 %",3680],["Ethylenglykol 40 %",3480],["Ethylenglykol 50 %",3270],["Propylenglykol 30 %",3850],["Propylenglykol 40 %",3680],["Propylenglykol 50 %",3480],["Luft",1005]];

/* ============ FORMELN ============
 in: [id, Label, Größe, Std-Einheit, Std-Wert(in Std-Einheit), presets?]
 out:[Label, Größe, Std-Einheit, fn(v)->SI] */
const F={mech:[
 {g:"Geometrie",t:"Kreis",f:"A = π·d²/4    U = π·d",in:[["d","Durchmesser d","len","mm",50]],out:[["Fläche A","area","mm²",v=>Math.PI*v.d**2/4],["Umfang U","len","mm",v=>Math.PI*v.d]]},
 {g:"Geometrie",t:"Kreisring / Rohrquerschnitt",f:"A = π·(D² − d²)/4",in:[["D","Aussen-Ø D","len","mm",60],["d","Innen-Ø d","len","mm",50]],out:[["Fläche A","area","mm²",v=>Math.PI*(v.D**2-v.d**2)/4]]},
 {g:"Geometrie",t:"Zylinder / Kugel Volumen",f:"V_Zyl = π·d²/4·h    V_Kugel = π·d³/6",in:[["d","Durchmesser d","len","mm",100],["h","Höhe h","len","mm",200]],out:[["Zylindervolumen","vol","l",v=>Math.PI*v.d**2/4*v.h],["Kugelvolumen (Ø d)","vol","l",v=>Math.PI*v.d**3/6]]},
 {g:"Masse",t:"Masse aus Volumen",f:"m = V · ρ",in:[["V","Volumen V","vol","dm³",1],["r","Dichte ρ","dens","kg/m³",7850,MAT_RHO]],out:[["Masse m","mass","kg",v=>v.V*v.r]]},
 {g:"Masse",t:"Masse Rundstab",f:"m = π·d²/4 · L · ρ",in:[["d","Durchmesser d","len","mm",40],["L","Länge L","len","mm",1000],["r","Dichte ρ","dens","kg/m³",7850,MAT_RHO]],out:[["Masse m","mass","kg",v=>Math.PI*v.d**2/4*v.L*v.r],["Metergewicht","mass","kg",v=>Math.PI*v.d**2/4*v.r]]},
 {g:"Masse",t:"Masse Rohr",f:"m = π·(D² − (D−2s)²)/4 · L · ρ",in:[["D","Aussen-Ø D","len","mm",48.3],["s","Wandstärke s","len","mm",3.2],["L","Länge L","len","mm",1000],["r","Dichte ρ","dens","kg/m³",7850,MAT_RHO]],out:[["Masse m","mass","kg",v=>Math.PI*(v.D**2-(v.D-2*v.s)**2)/4*v.L*v.r],["Metergewicht","mass","kg",v=>Math.PI*(v.D**2-(v.D-2*v.s)**2)/4*v.r]]},
 {g:"Masse",t:"Masse Blech / Flachstahl / Block",f:"m = a · b · t · ρ",in:[["a","Länge a","len","mm",1000],["b","Breite b","len","mm",500],["t","Dicke t","len","mm",5],["r","Dichte ρ","dens","kg/m³",7850,MAT_RHO]],out:[["Masse m","mass","kg",v=>v.a*v.b*v.t*v.r]]},
 {g:"Masse",t:"Gewichtskraft",f:"F_G = m · g",in:[["m","Masse m","mass","kg",100],["g","Erdbeschl. g","acc","m/s²",9.81]],out:[["Gewichtskraft","force","N",v=>v.m*v.g]]},

function satP(r,t){const d=REF[r].p;const pts=RT.map((T,i)=>[T,d[i]]).filter(x=>x[1]);
  if(t<pts[0][0]||t>pts[pts.length-1][0])return NaN;
  for(let i=0;i<pts.length-1;i++){const[a,pa]=pts[i],[b,pb]=pts[i+1];if(t>=a&&t<=b){const f=(t-a)/(b-a);return Math.exp(Math.log(pa)+f*(Math.log(pb)-Math.log(pa)))}}return NaN}
function satT(r,p){const d=REF[r].p;const pts=RT.map((T,i)=>[T,d[i]]).filter(x=>x[1]);
  if(p<pts[0][1]||p>pts[pts.length-1][1])return NaN;
  for(let i=0;i<pts.length-1;i++){const[a,pa]=pts[i],[b,pb]=pts[i+1];if(p>=pa&&p<=pb){const f=(Math.log(p)-Math.log(pa))/(Math.log(pb)-Math.log(pa));return a+f*(b-a)}}return NaN}

const vis=e=>!e.closest(".hide")&&e.offsetParent!==null;
const selTxt=s=>s.options[s.selectedIndex]?s.options[s.selectedIndex].text:"";
// Liest eine Rechenkarte in Abschnitte aus: Eingaben, Formteile, Ergebnisse
function cardReport(card){
  const secs=[];let cur={h:"Eingaben",rows:[]};secs.push(cur);
  const walk=n=>{for(const e of n.children){
    if(e.classList.contains("hide"))continue;
    if(e.classList.contains("sub")){cur={h:e.textContent.trim(),rows:[]};secs.push(cur);continue}
    if(e.tagName==="SUMMARY"){cur={h:e.textContent.trim(),rows:[]};secs.push(cur);continue}
    if(e.classList.contains("fit")){for(const f of e.children){const n=parse(f.children[1].value);if(n>0)cur.rows.push([f.children[0].textContent,n+" ×",f.children[2].textContent])}if(!cur.rows.length)cur.rows.push(["keine Formteile","",""]);continue}
    if(e.classList.contains("row")){const lab=e.children[0].textContent.trim();const a=e.children[1],b=e.children[2];
      const val=x=>!x?"":x.tagName==="INPUT"?(isFinite(parse(x.value.replace(/[’']/g,"")))?fmt(parse(x.value.replace(/[’']/g,""))):x.value):x.tagName==="SELECT"?selTxt(x):x.classList&&x.classList.contains("seg")?(x.querySelector(".on")||{}).textContent||"":x.textContent.trim();
      if(a&&a.classList&&a.classList.contains("seg"))cur.rows.push([lab,val(a),""]);
      else if(a&&a.tagName==="SELECT"&&!b)cur.rows.push([lab,val(a),""]);
      else cur.rows.push([lab,val(a),val(b)]);
      if(e.classList.contains("out"))cur.rows[cur.rows.length-1].res=1;
      else if(e.closest("details")&&a&&a.tagName==="INPUT"&&parse(a.value)===0)cur.rows.pop();
      continue}
    if(e.children.length&&!["fig","f","note","hint","preset","grp"].some(k=>e.classList.contains(k))&&e.tagName!=="H3")walk(e);
  }};walk(card);
  return{title:card.dataset.pdf||card.querySelector("h3").textContent,group:(card.querySelector(".grp")||{}).textContent||"",formula:(card.querySelector(".f")||{}).textContent||"",
    note:[...card.querySelectorAll(".note")].map(x=>x.textContent).filter(Boolean).join(" "),hint:[...card.querySelectorAll(".hint")].map(x=>x.textContent).join(" "),secs:secs.filter(s=>s.rows.length)};
}
async function makePdf(card,meta){
  await loadJs("jspdf.umd.min.js");await loadJs("pdffont.js");
  const R=cardReport(card),{jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"});
  doc.addFileToVFS("DV.ttf",RELIB_FONTS.n);doc.addFont("DV.ttf","DV","normal");doc.addFileToVFS("DVB.ttf",RELIB_FONTS.b);doc.addFont("DVB.ttf","DV","bold");
  const NAVY=[23,58,107],ORA=[239,125,31],W=210,M=15;let y=0,page=1;
  const now=new Date(),dstr=now.toLocaleDateString("de-CH")+" "+now.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
  const logo=await imgData("icon-192.png");
  const head=()=>{doc.setFillColor(...NAVY);doc.rect(0,0,W,24,"F");if(logo)doc.addImage(logo,"PNG",M,4,16,16);
    doc.setTextColor(255);doc.setFont("DV","bold");let fs=14;doc.setFontSize(fs);while(doc.getTextWidth(R.title)>122&&fs>9){fs-=0.5;doc.setFontSize(fs)}doc.text(R.title,M+20,11.5);
    doc.setFont("DV","normal");doc.setFontSize(8.5);doc.text("re.lib · "+R.group,M+20,17.5);doc.text(dstr,W-M,17.5,{align:"right"});doc.text("re engineering solution",W-M,11.5,{align:"right"});
    doc.setFillColor(...ORA);doc.rect(0,24,W,1.2,"F");y=32};
  const foot=()=>{doc.setFont("DV","normal");doc.setFontSize(7.5);doc.setTextColor(120);doc.setDrawColor(200);doc.line(M,284,W-M,284);
    doc.text("Erstellt mit re.lib"+(isBuilt?" v"+APP_VER:"")+" – Rechenwerte sind Richtwerte, Auslegung durch Fachperson prüfen.",M,288.5);doc.text("Seite "+page,W-M,288.5,{align:"right"})};
  const need=h=>{if(y+h>281){foot();doc.addPage();page++;head()}};
  head();
  // Projektangaben
  doc.setTextColor(30);doc.setFontSize(9.5);
  const info=[["Projekt / Anlage",meta.proj||"–"],["Position / Bemerkung",meta.pos||"–"],["Bearbeitet von",meta.by||"–"],["Datum",dstr]];
  doc.setDrawColor(210);doc.setFillColor(244,246,249);doc.roundedRect(M,y-4.5,W-2*M,info.length*5.4+3,1.5,1.5,"FD");
  info.forEach(([k,v],i)=>{doc.setFont("DV","normal");doc.setTextColor(100);doc.text(k,M+3,y+i*5.4);doc.setTextColor(20);doc.setFont("DV","bold");doc.text(String(v),M+48,y+i*5.4)});
  y+=info.length*5.4+5;
  // Formel
  if(R.formula){need(16);doc.setFont("DV","bold");doc.setFontSize(10);doc.setTextColor(...NAVY);doc.text("Berechnungsgrundlage",M,y);y+=5;
    doc.setFont("DV","normal");doc.setFontSize(8.5);doc.setTextColor(60);doc.splitTextToSize(R.formula,W-2*M).forEach(l=>{need(5);doc.setFont("DV","normal");doc.setFontSize(8.5);doc.setTextColor(60);doc.text(l,M,y);y+=4.1});y+=2}
  // Abschnitte
  for(const s of R.secs){need(s.h==="Ergebnis"?Math.min(50,8+s.rows.length*4.9):14);doc.setFont("DV","bold");doc.setFontSize(10.5);doc.setTextColor(...NAVY);doc.text(s.h,M,y);doc.setDrawColor(...ORA);doc.setLineWidth(.5);doc.line(M,y+1.5,M+30,y+1.5);doc.setLineWidth(.2);y+=5.3;
    s.rows.forEach((r,i)=>{need(5.2);if(r.res){doc.setFillColor(233,247,241);doc.rect(M,y-3.6,W-2*M,4.9,"F")}else if(i%2){doc.setFillColor(247,248,250);doc.rect(M,y-3.6,W-2*M,4.9,"F")}
      doc.setFontSize(8.9);doc.setFont("DV","normal");doc.setTextColor(40);doc.text(doc.splitTextToSize(r[0],95)[0],M+2,y);
      doc.setFont("DV",r.res?"bold":"normal");doc.setTextColor(...(r.res?[13,110,79]:[20,20,20]));doc.text(String(r[1]),M+138,y,{align:"right"});
      doc.setFont("DV","normal");doc.setTextColor(70);doc.text(String(r[2]||""),M+141,y);y+=4.9});y+=2.5}
  if(R.note){need(12);doc.setFont("DV","bold");doc.setFontSize(9);doc.setTextColor(154,91,0);doc.splitTextToSize("Hinweis: "+R.note,W-2*M).forEach(l=>{need(5);doc.setFont("DV","bold");doc.setFontSize(9);doc.setTextColor(154,91,0);doc.text(l,M,y);y+=4.3});y+=2}
  if(R.hint){doc.setFont("DV","normal");doc.setFontSize(8.3);doc.setTextColor(100);doc.splitTextToSize(R.hint,W-2*M).forEach(l=>{need(5);doc.setFont("DV","normal");doc.setFontSize(8.3);doc.setTextColor(100);doc.text(l,M,y);y+=4})}
  foot();
  const fn=(R.title.split(/[ –(]/)[0]||"Berechnung")+"_"+(meta.proj?meta.proj.replace(/[^\wäöüÄÖÜ-]+/g,"_")+"_":"")+now.toISOString().slice(0,10)+".pdf";
  return{doc,fn};
}
async function savePdf(doc,fn){
  if(window.relibDesktop){const f=await window.relibDesktop.savePdf(fn,doc.output("datauristring").split(",")[1]);return f?"PDF gespeichert und geöffnet":"Abgebrochen"}
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()){ // Android-App: Datei speichern und Teilen-Menü (Drucken, OneDrive, Mail …)
    const FS=C.Plugins.Filesystem,SH=C.Plugins.Share;if(!FS||!SH)throw new Error("Für den PDF-Export bitte die neue APK einmal installieren");const b64=doc.output("datauristring").split(",")[1];
    const w=await FS.writeFile({path:fn,data:b64,directory:"CACHE"});await SH.share({title:fn,url:w.uri,dialogTitle:"PDF speichern oder drucken"});return "PDF erstellt"}
  const blob=doc.output("blob"),url=URL.createObjectURL(blob);
  let w=null;try{w=window.open(url,"_blank")}catch(e){}                 // PDF im Viewer öffnen → Drucken / Speichern
  if(!w){const a=document.createElement("a");a.href=url;a.download=fn;document.body.append(a);a.click();a.remove()}
  setTimeout(()=>URL.revokeObjectURL(url),120000);return w?"PDF geöffnet – drucken oder speichern":"PDF gespeichert: "+fn;
}

/* ============ UPDATE (Android-App & Windows-App) ============ */
const APP_VER="__BUILD__";               // wird beim Bau auf GitHub gesetzt
const FEED="__FEED__";                   // GitHub-Release version.json (Android)
const isBuilt=!APP_VER.startsWith("__");
const DESK=window.relibDesktop||null;    // Windows-App (Electron)
document.getElementById("verlbl").textContent=isBuilt?"v"+APP_VER:"";
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2800)}
let _upd=null;
const isNative=()=>{const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform())};
const updater=()=>{if(_upd)return _upd;if(!isNative())return null;const C=window.Capacitor;
  _upd=(C.Plugins&&C.Plugins.CapacitorUpdater)||(C.registerPlugin?C.registerPlugin("CapacitorUpdater"):null);return _upd};
function updBar(text,btnText,onClick){
  document.getElementById("updbar")?.remove();
  const btn=el("button",{type:"button",class:"upd-go"},btnText);const lab=el("span",{},text);
  const bar=el("div",{id:"updbar",role:"status"},lab,btn,el("button",{type:"button",class:"upd-x","aria-label":"Später",onclick:()=>bar.remove()},"✕"));
  btn.addEventListener("click",()=>onClick(btn,lab));document.getElementById("updslot").prepend(bar);return{btn,lab};
}
// ---- Windows ----
let deskManual=false;
if(DESK){
  DESK.version().then(v=>{document.getElementById("verlbl").textContent="v"+v}).catch(()=>{});
  DESK.onUpdate(m=>{
    if(m.s==="available")updBar("Update verfügbar: Version "+m.d,"Jetzt aktualisieren",(btn,lab)=>{btn.disabled=true;btn.textContent="Wird geladen …";DESK.download().catch(()=>{btn.disabled=false;btn.textContent="Erneut versuchen"})});
    else if(m.s==="progress"){const b=document.querySelector("#updbar .upd-go");if(b)b.textContent="Lädt … "+m.d+" %"}
    else if(m.s==="ready")updBar("Update ist bereit.","Neu starten & installieren",btn=>{btn.disabled=true;DESK.install()});
    else if(m.s==="none"){if(deskManual)toast("re.lib ist aktuell")}
    else if(m.s==="error"){if(deskManual)toast("Update-Server nicht erreichbar");const b=document.querySelector("#updbar .upd-go");if(b){b.disabled=false;b.textContent="Erneut versuchen"}}
  });
}
async function checkUpdate(manual){
  if(DESK){deskManual=manual;const r=await DESK.check().catch(()=>({}));if(r&&r.dev&&manual)toast("Entwicklungsversion – keine Updates");return}
  if(!isNative()){if(manual)toast("Updates gibt es in der installierten App (Android / Windows)");return}
  const U=updater();let remote;
  try{try{await U.notifyAppReady()}catch(e){}
    remote=await(await fetch(FEED+"?t="+Date.now(),{cache:"no-store"})).json();}
  catch(e){if(manual)toast("Update-Server nicht erreichbar");return}
  // Neue Android-Bausteine nötig? → komplette APK neu installieren
  let build=0;try{const A=window.Capacitor.Plugins.App;if(A)build=+(await A.getInfo()).build}catch(e){}
  if(remote.minApk&&build&&build<+remote.minApk&&remote.apk){
    updBar("Neue App-Version "+remote.version+" (Installation nötig)","APK herunterladen",()=>{location.href=remote.apk});return}
  if(+remote.version>+APP_VER){
    updBar("Update verfügbar: Version "+remote.version,"Jetzt aktualisieren",async(btn)=>{btn.disabled=true;btn.textContent="Wird geladen …";
      try{const b=await U.download({url:remote.url,version:String(remote.version)});btn.textContent="Wird installiert …";await U.set({id:b.id})}
      catch(e){btn.disabled=false;btn.textContent="Erneut versuchen";toast("Update fehlgeschlagen")}});
  }else if(manual)toast("re.lib ist aktuell (Version "+APP_VER+")");
}
document.getElementById("updchk").addEventListener("click",()=>checkUpdate(true));
setTimeout(()=>checkUpdate(false),1500);
